name: ci

on:
  push:
    branches: [main, phase-1]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      - name: Core tests
        run: cargo test -p barnaby-core
      - name: UI checks
        working-directory: ui
        run: bun install --frozen-lockfile && bun run check && bun test

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    # Portable whisper.cpp: by default ggml targets the build machine's CPU, which may
    # not match the users' (whisper-rs-sys forwards GGML_* variables to CMake).
    env:
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with:
          key: sherpa
          # sherpa-rs-sys downloads its libraries here; a cached build script without them fails to link.
          cache-directories: |
            ~/.cache/sherpa-rs
            ~/AppData/Local/sherpa-rs
      - uses: oven-sh/setup-bun@v2
      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libxdo-dev libssl-dev cmake clang
      - name: UI deps
        working-directory: ui
        run: bun install --frozen-lockfile
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Engine tests
        run: cargo test -p barnaby-engine
      - name: Build installers
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # The sherpa-onnx DLLs exist only after a release build; tauri-build checks
            # resource globs at build-script time, hence the two passes.
            cargo build --release -p barnaby
            bunx @tauri-apps/cli@2.12.3 build --config tauri.bundle-windows.json
          else
            bunx @tauri-apps/cli@2.12.3 build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: barnaby-${{ runner.os }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.msi
            target/release/bundle/**/*-setup.exe
