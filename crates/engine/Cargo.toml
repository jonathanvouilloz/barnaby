[package]
name = "barnaby-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dependencies]
barnaby-core.workspace = true
anyhow.workspace = true
hound.workspace = true
log.workspace = true
cpal = "0.18.2"
whisper-rs = { version = "0.16.0", features = ["log_backend"] }
# One ONNX runtime for both diarization and VAD: sherpa-onnx ships it, prebuilt per target.
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
bzip2 = "0.6.1"
tar = "0.4.46"
