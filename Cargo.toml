[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "src-tauri"]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
barnaby-core = { path = "crates/core" }
barnaby-engine = { path = "crates/engine" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3.5"
log = "0.4"
